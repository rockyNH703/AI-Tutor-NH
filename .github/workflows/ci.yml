name: CI

# One repository, one commit: every push checks the backend, the frontend and the two together.
# Advisory: `bun run deploy` never waits for these runs, and `bun run status` shows their verdict
# on the production checkout. `bun run verify` runs the same commands locally when wanted
# (deploy/verify/run-ci.sh, kept identical to this file by deploy/tests/ci-parity.test.mjs). The
# runtimes are the pinned ones production uses: backend/requirements.lock, .node-version, .bun-version.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, contract, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: aichat
          POSTGRES_PASSWORD: aichat
          POSTGRES_DB: aichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aichat -d aichat"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aichat:aichat@127.0.0.1:5432/aichat_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # no job pushes: the token never stays on disk

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.*

      - name: Install the locked runtime dependencies (hashes verified), then the dev tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: API contract is current (docs/openapi.json)
        run: python scripts/export_openapi.py --check

      - name: OCR engine, as production installs it (deploy-netsec/install.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Tests (PostgreSQL + pgvector, fake LLM, API end-to-end)
        run: python -m pytest -o addopts="" -ra

  frontend:
    name: Frontend (typecheck, lint, tests incl. contract, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # no job pushes: the token never stays on disk

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests (routes.test.ts checks the BFF against docs/openapi.json)
        run: bun run test

      - name: NetSec deploy script tests (deploy-netsec/tests)
        run: bun test ../deploy-netsec/tests

      - name: Production build (on the pinned Node)
        run: bun run build

  integration:
    name: Integration (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: aichat
          POSTGRES_PASSWORD: aichat
          POSTGRES_DB: aichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aichat -d aichat"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Keyword-hash embeddings for the ingest below and the suite's API (Playwright passes the environment on).
      EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # no job pushes: the token never stays on disk

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Backend from the lock, database migrated
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          .venv/bin/python -m alembic upgrade head

      - name: One global knowledge source for the citation journey (e2e/p2-headed-verification.e2e.ts)
        working-directory: backend
        run: .venv/bin/python scripts/ingest_documents.py --source e2e-osint --global ../frontend/apps/app/e2e/fixtures/osint.md

      - name: Frontend dependencies and a browser
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          cd apps/app && bunx playwright install --with-deps chromium webkit

      - name: End-to-end (the built web app + BFF + API + PostgreSQL + Mailpit, fake LLM)
        run: bun run test:e2e
