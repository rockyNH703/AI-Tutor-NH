# Production PostgreSQL 16 + pgvector: the isolated PadhAI datastore.
#
# Started by aichat-postgres.service:
#   docker compose --env-file /etc/aichat/postgres.env -f deploy/compose/docker-compose.yml up -d
#
# Binds to a configurable loopback-only host port. The volume IS the database: never
# `docker compose down -v`. Backups: aichat-pg-backup.timer runs deploy/backup.sh nightly.
#
# Project, network and volume names are explicit and PadhAI-specific. Never reuse them for
# another application or change them on an existing installation: a different volume is empty.
name: padhai-postgres
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in /etc/aichat/postgres.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /etc/aichat/postgres.env}
      POSTGRES_DB: ${POSTGRES_DB:-padhai}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  postgres:
    name: padhai_postgres_network

volumes:
  pgdata:
    name: padhai_postgres_data
